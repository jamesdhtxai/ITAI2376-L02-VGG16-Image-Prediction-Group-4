name: Assemble slide deck

on:
  workflow_dispatch:
  push:
    paths:
      - '.deck-upload/**'
      - '.github/workflows/assemble-slide-deck.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble PowerPoint
        run: |
          mkdir -p slides
          cat .deck-upload/chunk-* | base64 -d > slides/Group_4_L02_VGG16_Tool_Learning_Starter_Deck_Cleaned.pptx
          test -s slides/Group_4_L02_VGG16_Tool_Learning_Starter_Deck_Cleaned.pptx
      - name: Commit deck
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slides/Group_4_L02_VGG16_Tool_Learning_Starter_Deck_Cleaned.pptx
          git diff --cached --quiet && exit 0
          git commit -m 'Add cleaned Group 4 slide deck'
          git push
